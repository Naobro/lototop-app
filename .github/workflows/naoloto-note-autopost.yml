name: NAO LOTO note記事修正
on:
  workflow_dispatch:
    inputs:
      mode:
        default: draft
        type: choice
        options: [draft, publish]
      date:
        required: false
permissions:
  contents: write
concurrency:
  group: naoloto-note-autopost
  cancel-in-progress: false
jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 承認済み記事を更新
        env:
          NOTE_COOKIE: ${{ secrets.NOTE_COOKIE }}
        run: node autopost/revise_note.js
      - uses: actions/checkout@v4
        with:
          ref: main
          path: recorded
      - name: 改訂公開予想を保存
        run: |
          node - <<'JS'
          const fs=require('fs'),p='recorded/autopost/state/forecasts.json',s=JSON.parse(fs.readFileSync(p)),f=JSON.parse(fs.readFileSync('autopost/revision-forecast.json')),old=s['2026-10-05'];
          f.published=true;f.noteKey=old.noteKey;f.source=old.source;f.revisedAt=new Date().toISOString();f.previousVersions=[...(old.previousVersions||[]),{...old,previousVersions:undefined}];s['2026-10-05']=f;fs.writeFileSync(p,JSON.stringify(s,null,2)+'\n');
          JS
          git -C recorded config user.name naoloto-bot
          git -C recorded config user.email naoloto-bot@users.noreply.github.com
          git -C recorded add autopost/state/forecasts.json
          git -C recorded commit -m "note改訂済み予想保存: 2026-10-05"
          git -C recorded pull --rebase
          git -C recorded push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: note-revision
          path: autopost/out/
